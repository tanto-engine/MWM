<svg xmlns="http://www.w3.org/2000/svg" width="960" height="244" viewBox="0 0 960 244" role="img" aria-labelledby="title desc">
  <title id="title">How a recording becomes a selectable move</title>
  <desc id="desc">Recorder evidence is organized by weapon and boss, matched to the source bank and assets, then reviewed as an ordered move graph. Only supported adaptations become UI choices.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#8caac2"/></marker></defs>
  <rect width="960" height="244" rx="12" fill="#111920"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#eef4fa">
    <text x="24" y="35" font-size="21" font-weight="600">From a recorded boss move to a menu choice</text>
    <text x="24" y="61" font-size="14" fill="#b6c9d8">An action number is local to its source bank. Notes, timing and asset identity keep moves distinct.</text>
    <g fill="#18252f" stroke="#5c778b"><rect x="24" y="86" width="210" height="132" rx="7"/><rect x="258" y="86" width="210" height="132" rx="7"/><rect x="492" y="86" width="210" height="132" rx="7"/><rect x="726" y="86" width="210" height="132" rx="7"/></g>
    <g stroke="#8caac2" stroke-width="1.5" marker-end="url(#arrow)"><path d="M235 151 H252"/><path d="M469 151 H486"/><path d="M703 151 H720"/></g>
    <g font-size="18" font-weight="600"><text x="40" y="117">1. Keep evidence</text><text x="274" y="117">2. Match identity</text><text x="508" y="117">3. Review phases</text><text x="742" y="117">4. Offer bindings</text></g>
    <g font-size="14" fill="#d6e2ec">
      <text x="40" y="146">Original IDs and notes.</text><text x="40" y="168">Group by weapon and boss.</text>
      <text x="274" y="146">Check bank, motion, build.</text><text x="274" y="168">Match installed archive data.</text>
      <text x="508" y="146">Link startup and follow-ups.</text><text x="508" y="168">Adapt recovery and contact.</text>
      <text x="742" y="146">Expose supported inputs.</text><text x="742" y="168">Test the move on William.</text>
    </g>
    <g font-size="12" fill="#9ab4c9"><text x="40" y="199">dataset/evidence + weapons</text><text x="274" y="199">dataset/compile_trial.py</text><text x="508" y="199">data/imports + Engine</text><text x="742" y="199">Engine move_capabilities()</text></g>
  </g>
</svg>
