<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>MWM · Multi-Weapon Moveset Mod</title>
  <link rel="stylesheet" href="style.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <div class="app">
    <header><div><p class="eyebrow">MWM · MOVESET EDITOR</p><h1>Single katana</h1><p class="subtitle" id="profile-name">Reading configuration…</p></div><div class="runtime"><span id="runtime">Connecting…</span><button id="enable" class="primary">Enable mod</button><button id="disable">Disable</button></div></header>
    <nav aria-label="Configuration"><button data-tab="moves" class="selected">Bindings</button><button data-tab="native">Overrides</button><button data-tab="frost">Frost Moon</button><button data-tab="speed">Tuning</button><button data-tab="collection">Collection</button><button data-tab="guide">Guide</button></nav>
    <p id="runtime-detail" role="status" class="hint"></p><main id="content" aria-busy="true"></main>
    <footer><div class="feedback"><p id="validation" role="status">Checking settings…</p><p id="notice" role="status">Reading configuration…</p></div><div class="actions"><button id="reload">Revert edits</button><button id="baseline">Original</button><button id="starter">Rebuild subset</button><button id="trial">Rebuild trial</button><button id="load">Load…</button><button id="save">Save as…</button><button id="apply" class="primary">Apply changes</button></div></footer>
  </div>
</body>
</html>
